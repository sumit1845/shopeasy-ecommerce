<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ShopEasy - Contact</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

    <div class="logo">
        🛒 <span>Shop</span>Easy
    </div>

    <nav>

        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="account.html">Account</a>

    </nav>

</header>


<main class="section">

    <div class="page-title">

        <span>HELP & SUPPORT</span>

        <h1>Contact ShopEasy</h1>

    </div>


    <div class="form-container">

        <form id="contactForm">

            <label>Your Name</label>

            <input
                type="text"
                id="contactName"
                required
            >


            <label>Email</label>

            <input
                type="email"
                id="contactEmail"
                required
            >


            <label>Your Message</label>

            <textarea
                id="contactMessage"
                required
            ></textarea>


            <button type="submit"
                    class="btn full-btn">
                Send Message
            </button>

        </form>


        <p id="contactResponse"></p>

    </div>

</main>


<script src="script.js"></script>

</body>

</html>
